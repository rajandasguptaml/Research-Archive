[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noshow"
version = "0.1.0"
description = "From Prediction Toward Action: explainable risk modeling and exploratory uplift analysis for patient no-show management"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["patient no-show", "uplift modeling", "explainable ai", "healthcare", "decision support"]

[project.scripts]
noshow = "noshow.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
